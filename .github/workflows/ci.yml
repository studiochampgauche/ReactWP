name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.22.0'
            php: '8.1'
          - os: ubuntu-latest
            node: '22.22.0'
            php: '8.3'
          - os: ubuntu-latest
            node: '22.22.0'
            php: '8.5'
          - os: ubuntu-latest
            node: '26.5.0'
            php: '8.5'
          - os: windows-latest
            node: '22.22.0'
            php: '8.1'
          - os: windows-latest
            node: '22.22.0'
            php: '8.3'
          - os: windows-latest
            node: '22.22.0'
            php: '8.5'
          - os: windows-latest
            node: '26.5.0'
            php: '8.5'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: configs/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml
          coverage: none

      - name: Install Node.js dependencies
        working-directory: configs
        run: npm ci

      - name: Audit Node.js dependencies
        working-directory: configs
        run: npm audit --audit-level=moderate

      - name: Run security regressions
        working-directory: configs
        run: npm run test:security

      - name: Run rendering regressions
        working-directory: configs
        run: npm run test:render

      - name: Build production assets
        working-directory: configs
        run: npm run prod

      - name: Validate Composer metadata
        working-directory: src/plugins/reactwp-accept-svg/template
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        working-directory: src/plugins/reactwp-accept-svg/template
        run: composer audit --locked
